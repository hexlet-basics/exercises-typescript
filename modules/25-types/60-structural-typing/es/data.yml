definitions:
  - name: Tipado estructural
    description: >
      principio que determina la compatibilidad de los tipos a partir de su
      descripción (estructura). Una variable de tipo `A` también puede usarse en
      un lugar donde se espera el tipo `B` si tiene la misma estructura o una más
      amplia.
